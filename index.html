<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDE6D3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>发现一家店 Find a Spot</title>
<style>
:root{--desk:#EDE6D3;--page:#FAF6EA;--ink:#1F3A6B;--soft:#5B6F95;--line:#D5CCB4;--dot:#E8E0CB;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hide{display:none!important}
main{max-width:480px;margin:0 auto;padding:10px 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.pill{font-size:13px;font-weight:600;border:1.5px solid var(--ink);border-radius:99px;padding:6px 14px;background:var(--page)}
.page{position:relative;flex:1;margin-top:8px;background:var(--page) radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/20px 20px;box-shadow:0 6px 18px #3a2c1428,0 1px 2px #0003;border-radius:3px;padding:34px 24px 26px;overflow:hidden;display:flex;flex-direction:column}
svg.dl{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
/* 首页 */
#home{flex:1;display:flex;flex-direction:column}
.corner{position:absolute;right:-10px;bottom:-34px;width:190px;color:var(--ink);opacity:.18;transform:rotate(-12deg);pointer-events:none}
.corner svg{display:block;width:100%;height:auto;stroke-width:1.3}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial{position:relative;width:290px;max-width:100%;aspect-ratio:240/230;margin-top:-30px}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .3s}
.dial.busy .ring{opacity:.45;pointer-events:none}
.ring text{font:600 13px system-ui,sans-serif;fill:var(--ink)}
#hdl{cursor:grab;outline:none}
#hdl:focus-visible{stroke-width:4.5}
.rp{transform-box:fill-box;transform-origin:center;animation:rip 8s ease-out infinite}
.rp2{animation-delay:.6s}
@keyframes rip{0%{transform:scale(1);opacity:.35}28%,100%{transform:scale(1.45);opacity:0}}
.dial.busy .rp{display:none}
.disc{position:absolute;left:50%;top:52.17%;width:50%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;transition:background .35s}
.disc:active{transform:translate(-50%,-50%) scale(.97)}
.disc:active .bw{animation-play-state:paused}
.bowl{width:58%;height:auto;fill:none;stroke:var(--page);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.bw{transform-box:fill-box;transform-origin:50% 100%;animation:wob 8s ease-in-out infinite}
@keyframes wob{0%,26%,100%{transform:rotate(0)}6%{transform:rotate(-7deg)}13%{transform:rotate(6deg)}20%{transform:rotate(-3deg)}}
.dots{display:none;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:jp .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes jp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-9px);opacity:1}}
.dial.busy .disc{background:#FFFDF6}
.dial.busy .dots{display:flex}
.dial.busy .bowl{display:none}
.msg{min-height:110px;margin-top:40px;text-align:center;max-width:260px}
.hint{font-size:13px;color:var(--soft)}
.et{font-size:14px;font-weight:600}
.eb{font-size:12.5px;color:var(--soft);margin-top:4px;line-height:1.5}
.link{font-size:14px;text-decoration:underline;text-underline-offset:4px;padding:6px;margin-top:8px}
.inr{margin-top:14px}
.inf{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--soft);color:var(--soft);font:italic 600 12px Georgia,serif;line-height:1}
.fine{max-width:72%;margin-top:12px;font-size:12px;line-height:1.6;color:var(--soft)}
/* 推荐页 */
#card{flex:1;display:flex;flex-direction:column}
.pol{position:relative;background:#fff;padding:10px 10px 16px;margin:12px 2px 0;box-shadow:0 6px 14px #2a1f0f2e,0 1px 2px #0003;transform:rotate(-1.5deg)}
.tp{position:absolute;left:50%;top:-13px;width:92px;height:24px;margin-left:-46px;transform:rotate(2deg);background:repeating-linear-gradient(0deg,#0000 0 3px,#ffffff1c 3px 4px),#D6B884cc;clip-path:polygon(0 0,100% 0,96% 25%,100% 50%,96% 75%,100% 100%,0 100%,4% 75%,0 50%,4% 25%)}
.ph{position:relative;aspect-ratio:4/3;background:#F1EBD9;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nop{position:absolute;inset:0;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.doodle{width:56%;color:var(--ink)}
.doodle svg{display:block;width:100%;height:auto;stroke-width:2}
.nop small{font-size:12px;color:var(--soft)}
.nop a{font-size:11px;font-weight:600;color:var(--ink)}
.nm{font-size:20px;font-weight:600;line-height:1.25;margin-top:14px;word-break:break-word}
.sub2{font-size:12px;color:var(--soft);margin-top:2px}
.sg{font-size:12.5px;color:var(--soft);margin-top:8px;line-height:1.55}
.sg span{display:block}
.credit{font-size:10px;color:var(--soft);margin-top:6px}
.one{font-size:16px;line-height:1.5;margin:30px 4px 0;text-align:center}
.acts{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;align-items:center}
.pbtn{display:block;width:100%;padding:14px 8px;background:var(--ink);color:var(--page);border-radius:6px;font-size:16px;font-weight:600;transition:transform .12s}
.pbtn:active{transform:scale(.985)}
.acts .link{margin-top:14px}
.drop{animation:d .55s cubic-bezier(.2,.9,.3,1.1)}
@keyframes d{from{opacity:0;transform:translateY(-26px) rotate(4deg)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bw,.rp,.dots i,.drop{animation:none}}
</style>
</head>
<body>
<main>
 <div class="bar">
  <button class="pill hide" id="back"></button><span id="sp"></span>
  <button class="pill" id="lang" aria-label="Language"></button>
 </div>
 <div class="page">

  <section id="home">
   <div class="corner" id="bigd" aria-hidden="true"></div>
   <div class="stage">
    <div class="dial" id="dial">
     <svg class="ring" id="ring" viewBox="0 0 240 230">
      <circle class="rp" cx="120" cy="120" r="62" fill="none" stroke="#1F3A6B" stroke-width="1.5"/>
      <circle class="rp rp2" cx="120" cy="120" r="62" fill="none" stroke="#1F3A6B" stroke-width="1.5"/>
      <path id="trk" fill="none" stroke="#1F3A6B" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
      <path id="fil" fill="none" stroke="#1F3A6B" stroke-width="3" stroke-linecap="round"/>

      <text x="49" y="216" text-anchor="middle">$</text>
      <text x="191" y="216" text-anchor="middle">$$</text>
     </svg>
     <button class="disc" id="go">
      <svg class="bowl" viewBox="0 0 170 126" aria-hidden="true"><g class="bw"><path d="M28 60H132C130 92 108 106 80 106C52 106 30 92 28 60Z"/><path d="M58 106v6h44v-6"/><path d="M44 60c10-10 18-10 26 0 8-10 18-10 26 0 8-10 14-8 20 0"/><path d="M98 52L130 14M110 56L142 22"/><path d="M62 44c-6-8 6-12 0-20M82 42c-6-8 6-12 0-20"/></g></svg>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
     </button>
    </div>
    <div class="msg" id="msg">
     <p class="hint hide" id="hint" role="status"></p>
     <p class="et hide" id="et" role="alert"></p>
     <p class="eb hide" id="eb"></p>
     <button class="link hide" id="retry"></button>
    </div>
   </div>
   <div class="inr"><button class="inf" id="info" aria-expanded="false">i</button></div>
   <p class="fine hide" id="fine"></p>
  </section>

  <section id="card" class="hide">
   <div class="pol" id="pol">
    <i class="tp"></i>
    <div class="ph" id="ph"></div>
    <h2 class="nm" id="name"></h2>
    <p class="sub2" id="alt"></p>
    <p class="sg" id="sg"></p>
    <p class="credit" id="credit"></p>
   </div>
   <p class="one" id="one"></p>
   <div class="acts">
    <button class="pbtn" id="nav"></button>
    <button class="link" id="next"></button>
   </div>
  </section>
 </div>
</main>
<script>

const D={Mo:0,Tu:1,We:2,Th:3,Fr:4,Sa:5,Su:6};
const HR=/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?\s*)+)?\s*(off|closed|(?:\d{1,2}:\d{2}-\d{1,2}:\d{2}(?:\s*,\s*)?)+)$/;
function days(s){const set=new Set();for(const p of s.split(',')){const m=p.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);if(!m)return null;const a=D[m[1]],b=m[2]?D[m[2]]:a;for(let i=a;;i=(i+1)%7){set.add(i);if(i===b)break}}return set}
function openState(h,now=new Date()){
 if(!h)return{s:null};
 if(h.trim()==='24/7')return{s:true,until:null};
 const dow=(now.getDay()+6)%7,prev=(dow+6)%7,mins=now.getHours()*60+now.getMinutes();
 let ok=false,until=null,parsed=false;
 for(const raw of h.split(';')){
  const r=raw.trim();if(!r)continue;
  const m=r.match(HR);if(!m)continue;
  const ds=m[1]?days(m[1].replace(/\s/g,'')):new Set([0,1,2,3,4,5,6]);
  if(!ds)continue;parsed=true;
  if(/^(off|closed)$/.test(m[2])){if(ds.has(dow)){ok=false;until=null}continue}
  for(const t of m[2].split(',')){
   const x=t.trim().match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);if(!x)continue;
   const a=x[1]*60+ +x[2],b=x[3]*60+ +x[4],end=t.trim().split('-')[1];
   if(a<b){if(ds.has(dow)&&mins>=a&&mins<b){ok=true;until=end}}
   else{if(ds.has(dow)&&mins>=a){ok=true;until=end}if(ds.has(prev)&&mins<b){ok=true;until=end}}
  }
 }
 return parsed?{s:ok,until}:{s:null};
}

 for(const u of EP){

const km=(a,b,c,d)=>{const R=6371,p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
/* 价位感 0–100：按店型和菜系估，不是真实价格 */
function priceOf(t,cu){
 let s=t.amenity==='food_court'?12:t.amenity==='fast_food'?28:50;
 if(cu.includes('street_food'))s=Math.min(s,18);
 if(cu.some(c=>['noodle','rice','soup','satay'].includes(c)))s=Math.min(s,34);
 if(t.takeaway==='only')s=Math.min(s,25);
 const adj={seafood:8,japanese:10,korean:6,western:8,thai:-5,vietnamese:-6,indonesian:-5,malay:-5,malaysian:-5,indian:-4,burmese:-5};
 for(const c of cu)if(adj[c]&&s>=40)s+=adj[c];
 if(t.wikidata||t.wikipedia)s+=4;
 if(t.reservation==='required'||t.reservation==='yes')s=Math.max(s,78);
 if(t.stars||cu.some(c=>['fine_dining','steak_house','french','italian','sushi','teppanyaki'].includes(c)))s=Math.max(s,86);
 return Math.max(0,Math.min(100,s));
}
function clean(els,lat,lon){
 const items=[],courts=[],seen=new Set();
 for(const el of els){
  const t=el.tags||{},la=el.lat??el.center?.lat,lo=el.lon??el.center?.lon;
  if(la==null||!t.name)continue;
  if(t.brand||t['brand:wikidata']||CHAIN.test(t.name)||CHAIN.test(t.brand||''))continue;
  const key=t.name+Math.round(la*1e3)+Math.round(lo*1e3);if(seen.has(key))continue;seen.add(key);
  const cu=(t.cuisine||'').split(/[;,]/).map(s=>s.trim().toLowerCase()).filter(Boolean);
  const o={id:el.type+el.id,t,la,lo,cu,kc:cu.find(c=>K[c]),dishId:dishOf(t,cu),price:priceOf(t,cu),dist:km(lat,lon,la,lo),court:t.amenity==='food_court'};
  if(o.court)courts.push(o);
  items.push(o);
 }
 for(const o of items){
  if(o.court)continue;
  let best=null,bd=.07;
  for(const c of courts){const d=km(o.la,o.lo,c.la,c.lo);if(d<bd){bd=d;best=c}}
  if(best){
   o.parent=best.t['name:en']&&best.t['name:en']!==best.t.name?best.t.name:best.t.name;best.hasStalls=true;
   const u=o.t['addr:unit'];if(u)o.unit=/^#/.test(u)?u:/^\d{1,2}-\d{1,3}\w?$/.test(u)?'#'+u:u;
  }
 }
 return items;
}
function score(p){
 const t=p.t,yr=new Date().getFullYear();let s=0;
 if(p.kc||p.dishId)s+=2;else if(p.cu.length)s+=1;
 if(t.opening_hours)s+=1;
 const y=parseInt((t.start_date||'').slice(0,4));if(y&&y<yr-1)s+=(yr-y>=5?2:1);
 if(t.wikidata||t.wikipedia)s+=3;
 if(t.outdoor_seating==='yes')s+=1;
 if(t.website||t.phone||t['contact:phone']||t['contact:website'])s+=1;
 if(t.description)s+=1;
 if(t.image||t.wikimedia_commons)s+=1;
 return s;
}
function pick(list){

}

 const x=(e.clientX-r.left)*k-CX,y=(e.clientY-r.top)*k-CY;

  const had=S.seen.size>0&&S.pool.some(p=>p.price<=S.max);S.seen.clear();
  if(S.screen!=='home')go('home');
  return showErr(had?'e3':'e4');
 }
 const ch=pick(list.map(x=>x.p)),it=list.find(x=>x.p===ch);
 S.seen.add(ch.id);
 S.cur={p:ch,st:it.st,photo:null};
 const cur=S.cur,ph=findPhoto(ch);
 if(!fromCard)await Promise.all([new Promise(r=>setTimeout(r,900)),S.ccP]);
 renderCard();go('card');setBusy(false);S.hint=null;S.err=null;renderMsg();
 const pol=$('#pol');pol.classList.remove('drop');void pol.offsetWidth;pol.classList.add('drop');
 ph.then(x=>{if(x&&S.cur===cur){cur.photo=x;if(S.screen==='card')renderCard()}});
}

$('#go').onclick=find;$('#next').onclick=find;$('#retry').onclick=find;
$('#back').onclick=()=>{go('home')};
$('#lang').onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';try{localStorage.setItem('spot:lang',S.lang)}catch(e){}applyLang()};
$('#info').onclick=()=>{const f=$('#fine');f.classList.toggle('hide');$('#info').setAttribute('aria-expanded',String(!f.classList.contains('hide')))};
applyLang();go('home');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
